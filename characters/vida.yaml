  i don't feel well:
    chance: 1.0
    cue: Someone just said they don't feel well. This is exactly what draws you - go to them, in your own quiet way, and ask after them properly.
  can't sleep:
    chance: 1.0
    cue: Someone said they can't sleep. Offer the kind of company that makes a quiet room feel less empty - no fuss, no lecture, just presence.
