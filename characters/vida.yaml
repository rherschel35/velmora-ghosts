    embed_color: '0x6FA37B'
    footer: Vida is quietly looking in on {user}.
    passive_cue: 'You''ve been quietly keeping an eye on {user} lately - someone you''re tending to. They just said: "{content}". Notice it the way you always do: warm and bright, never intrusive, never clinical.'
